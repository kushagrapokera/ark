name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck desktop-file-utils
      - name: Unit and integration tests
        run: cargo test --locked --all-features --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Release builds
        run: |
          cargo build --release --locked --bin ark
          cargo build --release --locked --bin ark-updater --features updater
      - name: Shell validation
        run: |
          sh -n packaging/*.sh tests/*.sh
          shellcheck packaging/*.sh
      - name: Desktop entry validation
        run: desktop-file-validate packaging/ark.desktop
      - name: Installer integration
        run: TMPDIR=${RUNNER_TEMP} sh tests/installer.sh
      - name: Curl bootstrap integration
        run: TMPDIR=${RUNNER_TEMP} sh tests/curl-installer.sh
      - name: Updater integration (curl)
        run: TMPDIR=${RUNNER_TEMP} sh tests/update.sh
      - name: Updater integration (wget)
        run: ARK_TEST_DOWNLOAD_TOOL=wget TMPDIR=${RUNNER_TEMP} sh tests/update.sh
      - name: Signed release integration
        run: TMPDIR=${RUNNER_TEMP} sh tests/signing.sh
      - name: Embedded update key integration
        run: TMPDIR=${RUNNER_TEMP} sh tests/embedded-key.sh
      - name: Installed update smoke
        run: TMPDIR=${RUNNER_TEMP} sh tests/update-smoke.sh
      - name: Diff validation
        run: git diff --check
